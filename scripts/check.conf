# scripts/check.conf — Leave Manager (Python 3.14 + FastAPI, vanilla JS). Bootstrap 2026-11-09.
# Format and rules: scripts/check.conf.example · docs/testing.md (Resource hygiene, Two speeds).
#
# GREENFIELD: there is no code yet (AGENTS.md rule 1), so every step below is a PLANNED step,
# written as a comment. The walking skeleton (first spec) creates the toolchain, uncomments
# these lines (adjusting them to what it built), runs ./scripts/residue for both profiles, and
# decides the fast/full split on the median of at least 3 runs (docs/testing.md, rule 5).
# Expected split: everything runs in-process and in memory, so every step is likely [fast].
#
# --- prerequisites (requires <step>: <command>; exit 0 = this machine can run the step) ---
# requires lint: uv python find 3.14
# requires format: uv python find 3.14
# requires types: uv python find 3.14
# requires architecture: uv python find 3.14
# requires test: uv python find 3.14
# requires test-js: node -e "process.exit(+process.versions.node.split('.')[0] >= 24 ? 0 : 1)"
#
# --- resource hygiene inventory (docs/testing.md, Resource hygiene) ---
# uv run: one-shot, starts no daemon or server.
# pytest: FastAPI TestClient runs the app in-process; no uvicorn, no port, no child process.
#   -p no:cacheprovider: no .pytest_cache is carried into the next run (rule 5, data).
#   Data: every test builds its own empty in-memory store (create_app fixture) — nothing persists.
# mypy: --no-incremental keeps no .mypy_cache between runs (cold, but nothing carried over).
# node --test: runs the test files in child processes that exit with the run; jsdom has no server.
# Uvicorn / dev servers / watch modes never belong here (rule 4).
#
# --- planned steps ---
# lint [fast]: uv run --frozen ruff check .
# format [fast]: uv run --frozen ruff format --check .
# types [fast]: uv run --frozen mypy --strict --no-incremental app
# architecture [fast]: uv run --frozen lint-imports
# security: no HTML sinks in frontend JS (docs/security.md); grep exit 1 = none found = green.
# no-html-sinks [fast]: sh -c 'grep -rnE "innerHTML|outerHTML|insertAdjacentHTML|document\.write" frontend --include=*.js --exclude-dir=tests; [ $? -eq 1 ]'
# test [fast]: uv run --frozen pytest -q -p no:cacheprovider
# test-js [fast]: node --test "frontend/tests/**/*.test.js"
